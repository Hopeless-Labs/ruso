[package]
name = "ruso-cli"
description = "CLI for the Ruso Scripting Language (RSL) vulnerability scanner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[[bin]]
name = "ruso"
path = "src/main.rs"

[dependencies]
ruso-runtime.workspace = true
ruso-script.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tracing.workspace = true
futures.workspace = true

# Registry client (login/publish/install/search). reqwest with rustls so we
# don't drag in openssl; multipart for `publish`, json for everything else.
reqwest.workspace = true
tokio = { workspace = true, features = ["sync"] }

clap = { version = "4.5", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi"] }
serde = { version = "1", features = ["derive"] }
csv = "1.3"
semver = "1"
dirs = "5"
